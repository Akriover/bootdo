# ===== Prod Profile — MySQL =====
# 启动: java -jar app.jar --spring.profiles.active=prod
# 或者 application.properties 里把 spring.profiles.active=prod

# MySQL 8.x 默认 JDBC URL 格式
# - useSSL=false: 本地开发关闭 SSL
# - serverTimezone=Asia/Shanghai: 中国时区, 避免时间字段差 8 小时
# - characterEncoding=utf8mb4: 支持 emoji + 中文
# - allowPublicKeyRetrieval=true: 解决 MySQL 8 默认 caching_sha2_password 认证坑
spring.datasource.url=jdbc:mysql://localhost:3306/userdb?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# 连接池 (HikariCP — Spring Boot 默认)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate — prod 用 validate, 严禁 update (防误删表)
# 表结构用 Flyway / Liquibase 单独管 (本 demo 暂不引)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

# 🔧 修 Hibernate 6 + MySQL 8 "Unknown table 'SEQUENCES' in information_schema" 启动失败
# 根因: Hibernate 6.6 默认 SequenceInformationExtractorLegacyImpl 查 information_schema.SEQUENCES
#      MySQL 8 不支持原生 SEQUENCE, 没这张表, 启动就 500
# 修法: 禁掉 JDBC metadata 查 sequence, 让 Hibernate 用 dialect 默认 (TABLE/IDENTITY 策略)
# 参考: https://github.com/spring-projects/spring-boot/issues/37973
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
